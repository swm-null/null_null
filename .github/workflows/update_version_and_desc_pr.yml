name: Update Version and Description on Pull Request

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions: write-all

jobs:
  update-version-and-description_pull_request:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Update version and description in main.py
        run: |
          VERSION=$(grep -oP '(?<=version=")[^"]*' srcs/main.py)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          PR_URL="${{ github.event.pull_request.html_url }}"
          DESCRIPTION="after PR ${{ github.event.pull_request.title }}(#${{ github.event.pull_request.number }}), $PR_URL"
          
          ESCAPED_DESCRIPTION=$(echo "$DESCRIPTION" | sed 's/[&/\]/\\&/g')

          sed -i "s|version=\"$VERSION\"|version=\"$NEW_VERSION\"|" srcs/main.py
          sed -i "s|description=\"[^\"]*\"|description=\"$ESCAPED_DESCRIPTION\"|" srcs/main.py

      - name: Commit changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add srcs/main.py
          git commit -m "Action: Update version and description"
          git push
