name: Update Version and Description on Direct Commit

on:
  push:
    branches:
      - develop

jobs:
  update-version-and-description_direct_commit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Update version and description in main.py
        run: |
          VERSION=$(grep -oP '(?<=version=")[^"]*' srcs/main.py)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          sed -i "s|version=\"$VERSION\"|version=\"$NEW_VERSION\"|" srcs/main.py

      - name: Commit changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add srcs/main.py
          git commit -m "Update version to and description"
          git push
